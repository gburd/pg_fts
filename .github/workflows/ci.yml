name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18, 19]   # 19 = master/devel, may not be packaged yet
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} + server headers
        # 19 lives in the pgdg -testing snapshot repo and may be missing entirely
        continue-on-error: ${{ matrix.pg == 19 }}
        run: |
          # The runner's preinstalled Microsoft apt repo intermittently serves a
          # broken InRelease and fails `apt-get update`; remove just that repo
          # (keep the LLVM/ubuntu repos — postgresql-server-dev depends on clang).
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources || true
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          if [ "${{ matrix.pg }}" = "19" ]; then
            sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg-testing main 19" > /etc/apt/sources.list.d/pgdg-testing.list'
          fi
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            gcc make libipc-run-perl

      - name: Build
        continue-on-error: ${{ matrix.pg == 19 }}
        run: make PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Install SQL is pure ASCII (installs on non-UTF-8 servers)
        run: make check-ascii

      - name: Allocation-safety lint (no unguarded corpus-scale palloc)
        run: make check-alloc

      - name: Install
        continue-on-error: ${{ matrix.pg == 19 }}
        run: sudo make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Regression + isolation tests
        continue-on-error: ${{ matrix.pg == 19 }}
        run: |
          PGBIN=/usr/lib/postgresql/${{ matrix.pg }}/bin
          # pg_virtualenv (from postgresql-common) spins up an ephemeral cluster
          # of the right major, exports PG* env (PGHOST/PGPORT/PGUSER as a
          # superuser), runs the command, and tears the cluster down. This is
          # the portable way to run `make installcheck` on Debian/pgdg PG.
          # REGRESS + ISOLATION are the correctness gate.  PGXS checks
          # TAP_TESTS with ifdef (a CLI TAP_TESTS=0 is ignored); PROVE_TESTS
          # points prove at a trivial always-pass file (ci/noop.pl) so the TAP
          # stage is a no-op in the gate.  The real TAP run is the next step.
          pg_virtualenv -v ${{ matrix.pg }} \
            make installcheck PROVE_TESTS=ci/noop.pl PG_CONFIG=$PGBIN/pg_config

      - name: Binary query input validation
        continue-on-error: ${{ matrix.pg == 19 }}
        run: pg_virtualenv -v ${{ matrix.pg }} python3 test/query_binary.py --local

      - name: TAP tests (corruption recovery, server encodings, concurrency)
        # Gating on 17/18 (the supported majors); best-effort on 19-devel.
        # t/003 (torn-page/corruption), t/004 (server encodings), t/005 (scan-vs-
        # merge page-recycle), t/007 (segment-cap under concurrent writes) and
        # t/008 (fts_vacuum reclaim) run here: t/001 (crash recovery) and t/002
        # (replication) need a full PostgreSQL::Test cluster-management setup that
        # pg_virtualenv does not provide, so they run locally / are exercised
        # elsewhere.  t/006 and t/010 also gate both supported majors here and
        # in the Nix flake.
        continue-on-error: ${{ matrix.pg == 19 }}
        run: |
          PGBIN=/usr/lib/postgresql/${{ matrix.pg }}/bin
          pg_virtualenv -v ${{ matrix.pg }} \
            make installcheck REGRESS= ISOLATION= \
              PROVE_TESTS='t/003_corruption.pl t/004_encodings.pl t/005_concurrency.pl t/006_concurrent_extend.pl t/007_segment_cap.pl t/008_vacuum_reclaim.pl t/010_vacuum_delete_heavy.pl t/011_shared_doclen.pl t/012_concurrent_flush.pl' \
              PG_CONFIG=$PGBIN/pg_config || {
              echo '=== TAP logs ==='
              cat tmp_check/log/*.log tmp_check/log/regress_log_* 2>/dev/null | tail -120 || true
              exit 1
            }

      - name: Show diffs on failure
        if: failure()
        run: |
          for f in regression.diffs output_iso/regression.diffs; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done

  # --- AddressSanitizer signal (best-effort) ----------------------------------
  # Builds BOTH PostgreSQL and pg_fts with AddressSanitizer and runs the
  # regression suite against that server, so the whole in-process SQL surface
  # (scan, insert, merge, bulkdelete, vacuum) runs instrumented and server and
  # extension share one asan runtime.  This GATES: a memory error fails the job.
  # The earlier pg_virtualenv approach was non-gating fiction -- a clang+ASan .so
  # would not dlopen into a stock apt postmaster, so every test "failed" and the
  # continue-on-error job stayed green (ROADMAP I10).  The `fuzz` job still gates
  # the on-disk parse surface with planted-bug teeth; this adds the SQL paths.
  # idx_scan_stats is omitted: it depends on stats-collector flush timing that is
  # unreliable under ASan slowdown (it is gated by the `test` job).
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps + fetch PostgreSQL source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang make bison flex libreadline-dev zlib1g-dev libicu-dev pkg-config perl libipc-run-perl wget ca-certificates
          PGV=17.6
          wget -q https://ftp.postgresql.org/pub/source/v$PGV/postgresql-$PGV.tar.bz2
          tar xf postgresql-$PGV.tar.bz2
          echo "PGSRC=$PWD/postgresql-$PGV" >> $GITHUB_ENV
          echo "PFX=$PWD/pgasan" >> $GITHUB_ENV
      - name: Build PostgreSQL with AddressSanitizer
        # The pg_virtualenv approach (loading a clang+ASan .so into a stock apt
        # postmaster) never worked on the runner: the asan runtime was not on
        # the server's loader path, so CREATE EXTENSION could not dlopen the .so
        # and all tests "failed" while the continue-on-error job stayed green --
        # i.e. the ASan SQL coverage was fiction (ROADMAP I10).  Build the SERVER
        # with ASan too, so server and extension share one runtime and the whole
        # SQL surface runs instrumented.
        run: |
          cd "$PGSRC"
          CC=clang CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
            ./configure --prefix="$PFX" --enable-cassert --enable-debug \
            --without-icu --with-llvm=no >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
      - name: Build + install pg_fts with AddressSanitizer
        run: |
          make CC=clang PG_CONFIG="$PFX/bin/pg_config" with_llvm=no \
            COPT="-fsanitize=address -fno-omit-frame-pointer -g -O1 -DUSE_ASSERT_CHECKING" \
            SHLIB_LINK="-fsanitize=address"
          make install PG_CONFIG="$PFX/bin/pg_config"
      - name: Smoke the in-process paths under an ASan-built PostgreSQL
        # ASan enlarges every stack frame, so raise the OS stack limit and
        # max_stack_depth together (a concrete ulimit, not unlimited: PostgreSQL
        # derives max_stack_depth from it).  detect_leaks=0: one-shot client
        # programs (pg_config, psql) leak small buffers on exit by design.
        # detect_stack_use_after_return=0: keep real-sized frames so the raised
        # max_stack_depth holds.  Runs test/asan_smoke.sql, not the full
        # regression suite: a few regression tests load large synthetic corpora
        # and run delete/vacuum loops that take many minutes each under ASan's
        # ~15x slowdown and add no path coverage the smoke lacks.  The smoke
        # drives build, every query type, pending flush, bulkdelete, vacuum
        # tail-truncation and merge on both doclen modes, with correctness
        # anchors.  This GATES -- a wrong answer or an ASan memory error fails it.
        run: |
          ulimit -s 32768
          export ASAN_OPTIONS="detect_leaks=0:detect_stack_use_after_return=0:abort_on_error=1:print_stacktrace=1:verify_asan_link_order=0:detect_odr_violation=0"
          D="$PWD/asandata"
          "$PFX/bin/initdb" -D "$D" -U postgres --no-locale -E UTF8 >/dev/null
          printf "unix_socket_directories='/tmp'\nlisten_addresses=''\nfsync=off\nmax_stack_depth='24MB'\nshared_buffers=256MB\n" >> "$D/postgresql.conf"
          "$PFX/bin/pg_ctl" -D "$D" -l "$D/log" -w start
          "$PFX/bin/createdb" -h /tmp -U postgres smoke
          "$PFX/bin/psql" -h /tmp -U postgres -d smoke -v ON_ERROR_STOP=1 -f test/asan_smoke.sql
          # fail on any ASan memory error in the server log
          if grep -iE "heap-use-after-free|heap-buffer-overflow|stack-buffer-overflow|global-buffer-overflow|use-after-poison|SUMMARY: AddressSanitizer: (heap|stack|global|use)" "$D/log"; then
            echo "ASan reported a memory error"; cat "$D/log"; exit 1
          fi
          "$PFX/bin/pg_ctl" -D "$D" -w stop
      - name: Show diffs on failure
        if: failure()
        run: |
          for f in regression.diffs output_iso/regression.diffs; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done

  # --- Fuzz / corruption harness (ASan+UBSan) ---------------------------------
  # Fuzzes the untrusted-on-disk parse surface (FOR codec, fts_doc validator,
  # block-header decode) and asserts the planted-bug teeth builds abort.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      - name: Run fuzz harness
        run: bash test/fuzz/run.sh

  # --- Property-based tests (hegel-c) -----------------------------------------
  # cmocka + hegel-c (FetchContent) property tests for the pure-C codec +
  # validator.  hegel-c spawns the `hegel` protocol server (from hegel-core,
  # not an apt package) as a subprocess; when that server isn't available on
  # the runner the property tests can't connect, so this job is BEST-EFFORT
  # (non-gating): it builds the suite (a real compile check of the property
  # tests) and runs ctest if a hegel server is present, warning otherwise.
  # The same on-disk parse surface is gated by the fuzz + sanitizer jobs.
  hegel:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libcmocka-dev libcbor-dev zlib1g-dev git
      - name: Build hegel property tests (compile check)
        run: |
          cmake -S test/hegel -B test/hegel/build \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" >/dev/null
          cmake --build test/hegel/build -j"$(nproc)"
      - name: Run hegel property tests (needs the hegel server)
        run: |
          if command -v hegel >/dev/null 2>&1 || [ -n "${HEGEL_SERVER_COMMAND:-}" ]; then
            ctest --test-dir test/hegel/build --output-on-failure
          else
            echo '::warning::hegel server not available on this runner; property tests compiled but not run. Install hegel-core (HEGEL_SERVER_COMMAND) to enable. The fuzz + sanitizer jobs gate the same surface.'
          fi

  # --- Coverage gate (>= 90% of pg_fts-own sources) ---------------------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 + coverage tooling
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources || true
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-17 postgresql-server-dev-17 gcc make libipc-run-perl lcov
      - name: Measure coverage (gate >= 90% of pg_fts-own sources)
        run: |
          PGBIN=/usr/lib/postgresql/17/bin
          # ci/coverage.sh builds with --coverage, runs REGRESS+ISOLATION against
          # a throwaway cluster, and gates line/function/branch coverage.
          # COV_CORPUS=1 also drives a moderate high-vocab corpus so the engine's
          # scale/feature branches count (matches the local measurement).
          COV_MIN=90 COV_CORPUS=1 PG_CONFIG=$PGBIN/pg_config PGBIN=$PGBIN \
            COV_HTML=coverage-html bash ci/coverage.sh
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
          if-no-files-found: ignore
